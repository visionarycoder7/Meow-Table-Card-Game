name: Verify and deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && !github.event.deleted
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.VERCEL_AUTO_DEPLOY_HOOK == 'true' &&
      github.event.head_commit.author.username != github.repository_owner)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Queue Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          case "$VERCEL_DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *)
              echo "::error::Set VERCEL_DEPLOY_HOOK_URL in the production environment."
              exit 1
              ;;
          esac

          if ! curl --silent --fail --output /dev/null --max-time 30 \
            --request POST -- "$VERCEL_DEPLOY_HOOK_URL"; then
            echo "::error::Vercel did not accept the deploy hook request."
            exit 1
          fi
          echo "Vercel accepted the request. Check the project dashboard for the build result."
