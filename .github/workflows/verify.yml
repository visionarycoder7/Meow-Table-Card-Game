name: Verify Meow Table

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build hosted app
        env:
          VITE_PUBLIC_SITE_URL: https://meow-table.example.com
          VITE_PUBLIC_SOURCE_URL: https://example.com/meow-table-source
        run: npm run build:hosted
      - run: npm run deploy:dry-run
